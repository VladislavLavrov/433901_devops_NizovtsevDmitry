name: nizovtsev13-pr2
services:
  mariadb:
    image: mariadb:10.11
    container_name: nizovtsev13-pr2-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: 13-WebCalculatorDb
      MARIADB_USER: calculator13
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5043}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  web:
    image: 13-calculator-mariadb:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nizovtsev13-pr2-web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=13-WebCalculatorDb;User=calculator13;Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};"
      Database__MigrateOnStartup: "true"
    ports:
      - "${WEB_PORT:-5313}:5055"
    depends_on:
      mariadb:
        condition: service_healthy
volumes:
  mariadb-data:
